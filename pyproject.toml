[project]
name = "road-segmentation"
version = "0.1.0"
description = "Project for road segmentation on satellite images"
authors = [
    {name = "Konstantin Myasnikov",email = "miasnikov.km@phystech.edu"}
]
readme = "README.md"
requires-python = ">=3.11"

packages = [
    { include = "road_segmentation" }
]

dependencies = [
    "torch (>=2.7.0,<3.0.0)",
    "hydra-core (>=1.3.2,<2.0.0)",
    "mlflow (>=2.22.0,<3.0.0)",
    "pytorch-lightning (>=2.5.1.post0,<3.0.0)",
    "torchvision (>=0.22.0,<0.23.0)",
    "dvc (>=3.59.2,<4.0.0)",
    "dvc-s3 (>=3.2.0,<4.0.0)",
    "pre-commit (>=4.2.0,<5.0.0)",
    "onnx (>=1.18.0,<2.0.0)",
    "onnxruntime (>=1.22.0,<2.0.0)",
    "fire (>=0.7.0,<0.8.0)",
]

[project.optional-dependencies]
gpu = [
    "tensorrt (>=8.6,<9.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
